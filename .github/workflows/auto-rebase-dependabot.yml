name: "[Auto] Merge main into dependabot-updates"

on:
  workflow_call:
    inputs:
      php_version:
        description: "PHP version used to regenerate composer.lock on conflict."
        type: string
        required: false
        default: "8.4"
      node_version:
        description: "Node version used to regenerate JS lockfiles on conflict. Defaults to .nvmrc, else 24."
        type: string
        required: false
        default: ""
    secrets:
      REBASE_TOKEN:
        description: "PAT used to push to branches protected by rulesets. Falls back to github.token if not provided."
        required: false

jobs:
  rebase:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Validate token
        env:
          TOKEN: ${{ secrets.REBASE_TOKEN || github.token }}
          TOKEN_SOURCE: ${{ secrets.REBASE_TOKEN != '' && 'REBASE_TOKEN' || 'the github.token fallback (REBASE_TOKEN was not set)' }}
        run: |
          status=$(curl -s -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}")
          if [ "$status" != "200" ]; then
            echo "::error::Token rejected by GitHub API (HTTP $status) — ${TOKEN_SOURCE} is invalid, expired, or lacks access to this repo."
            cat /tmp/resp.json
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.REBASE_TOKEN || github.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # Lockfile regeneration needs the toolchain the project actually targets:
      # the runner's stock PHP (8.3) can't resolve lockfiles that need 8.4, and
      # the npm bundled with older Node drops `libc` fields from package-lock.json.
      - name: Setup PHP
        if: hashFiles('composer.json') != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php_version }}
          tools: composer:v2

      - name: Resolve Node version
        id: node
        if: hashFiles('package.json') != ''
        env:
          INPUT_NODE_VERSION: ${{ inputs.node_version }}
        run: |
          if [ -n "$INPUT_NODE_VERSION" ]; then
            echo "version=$INPUT_NODE_VERSION" >> "$GITHUB_OUTPUT"
          elif [ -f .nvmrc ]; then
            echo "version=$(tr -d '[:space:]' < .nvmrc)" >> "$GITHUB_OUTPUT"
          else
            echo "version=24" >> "$GITHUB_OUTPUT"
          fi

      - name: Setup Node
        if: hashFiles('package.json') != ''
        uses: actions/setup-node@v7
        with:
          node-version: ${{ steps.node.outputs.version }}

      - name: Merge main into dependabot-updates
        env:
          GH_TOKEN: ${{ secrets.REBASE_TOKEN || github.token }}
        run: |
          set -euo pipefail

          # If a merge conflict is limited to regeneratable lockfile(s) (poetry.lock,
          # composer.lock, package-lock.json, yarn.lock, pnpm-lock.yaml), regenerate them
          # deterministically from the post-merge manifest instead of leaving it for a
          # human. Stages the resolved file(s) on success; returns non-zero (leaving the
          # conflict untouched) if anything is unresolvable or regeneration fails.
          try_resolve_lockfile_conflicts() {
            local conflicts
            conflicts="$(git diff --name-only --diff-filter=U)"
            [[ -n "$conflicts" ]] || return 1

            local path
            while IFS= read -r path; do
              case "$(basename "$path")" in
                poetry.lock | composer.lock | package-lock.json | yarn.lock | pnpm-lock.yaml) ;;
                *) return 1 ;;
              esac
            done <<< "$conflicts"

            echo "Conflict is limited to regeneratable lockfile(s), regenerating:"
            echo "$conflicts"

            while IFS= read -r path; do
              local dir
              dir="$(dirname "$path")"
              case "$(basename "$path")" in
                poetry.lock)
                  if ! command -v poetry &> /dev/null; then
                    pip install --user poetry
                    export PATH="$HOME/.local/bin:$PATH"
                  fi
                  rm -f "$path"
                  (cd "$dir" && poetry lock && poetry check) || return 1
                  ;;
                composer.lock)
                  rm -f "$path"
                  (cd "$dir" && composer update --no-interaction --no-install --no-scripts && composer validate --no-check-publish) || return 1
                  ;;
                package-lock.json)
                  rm -f "$path"
                  # npm 10 drops `libc` fields from package-lock.json; use npm 11+.
                  (cd "$dir" && npx -y npm@11 install --package-lock-only --ignore-scripts --no-audit --no-fund && npx -y npm@11 ls --package-lock-only) || return 1
                  ;;
                yarn.lock)
                  if ! command -v yarn &> /dev/null; then
                    npm install -g yarn
                  fi
                  rm -f "$path"
                  (
                    cd "$dir"
                    case "$(yarn --version)" in
                      1.*)
                        yarn install --non-interactive --ignore-scripts && yarn check --integrity --ignore-scripts
                        ;;
                      *)
                        # Yarn Berry (2+): no "yarn check" command; regenerate lockfile-only,
                        # then verify it wouldn't change again, without running any build scripts.
                        yarn install --mode=update-lockfile && yarn install --immutable --mode=skip-build
                        ;;
                    esac
                  ) || return 1
                  # Yarn Berry's PnP linker rewrites .pnp.cjs/.pnp.loader.mjs alongside the
                  # lockfile; re-stage them if (and only if) this repo already tracks them.
                  for pnp_file in "$dir/.pnp.cjs" "$dir/.pnp.loader.mjs"; do
                    if git ls-files --error-unmatch "$pnp_file" &> /dev/null; then
                      git add "$pnp_file"
                    fi
                  done
                  ;;
                pnpm-lock.yaml)
                  if ! command -v pnpm &> /dev/null; then
                    corepack enable pnpm 2> /dev/null || npm install -g pnpm
                  fi
                  rm -f "$path"
                  (cd "$dir" && pnpm install --lockfile-only --ignore-scripts && pnpm install --lockfile-only --frozen-lockfile --ignore-scripts) || return 1
                  ;;
              esac
              git add "$path"
            done <<< "$conflicts"
          }

          if git ls-remote --exit-code origin dependabot-updates; then
            git checkout dependabot-updates

            # Nothing left on the branch that main doesn't already have (e.g. its
            # PR was squash-merged): start it afresh from main rather than carrying
            # already-merged commits forward.
            if git diff --quiet origin/main HEAD; then
              echo "dependabot-updates has no changes beyond main, resetting it to main"
              git reset --hard origin/main
              git push origin dependabot-updates --force-with-lease
              exit 0
            fi

            # Merge main in rather than rebasing. A rebase replays every old bump
            # one at a time, so on a long-lived branch any bump main has since
            # overtaken (e.g. vitest 5.0.1 -> 5.0.2 when main is already on 5.1)
            # conflicts in the manifest even when the branch's end state agrees with
            # main. A merge only compares the two end states.
            if ! git merge origin/main --no-edit; then
              if ! try_resolve_lockfile_conflicts; then
                echo "Merge conflict is not limited to regeneratable lockfiles, aborting for manual resolution."
                git diff --name-only --diff-filter=U
                git merge --abort
                exit 1
              fi
              git commit --no-edit
            fi
            git push origin dependabot-updates
          else
            git checkout -b dependabot-updates origin/main
            git push origin dependabot-updates
          fi

      - name: Open PR if one doesn't exist
        env:
          GH_TOKEN: ${{ secrets.REBASE_TOKEN || github.token }}
        run: |
          if git diff --quiet origin/main dependabot-updates; then
            echo "dependabot-updates is identical to main, skipping PR creation"
            exit 0
          fi
          if ! gh pr list --head dependabot-updates --state open --json number | grep -q number; then
            gh pr create \
              --base main \
              --head dependabot-updates \
              --title "🛡️ dependabot updates" \
              --body "Aggregated dependabot dependency updates." \
              --draft
          fi
