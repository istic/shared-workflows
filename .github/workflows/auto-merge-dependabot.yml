name: "[Auto] Merge Dependabot Updates"

on:
  workflow_call:

jobs:
  automerge:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write

    steps:
      - name: Wait for checks to complete
        if: github.actor == 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR="${{ github.event.pull_request.number }}"
          if [[ -z "$PR" ]]; then
            echo "No PR number available, skipping wait"
            exit 0
          fi
          echo "Waiting up to 15 minutes for checks on PR #${PR} to settle..."
          timeout 900 gh pr checks "${PR}" --watch --interval 30 || true  # 900s = 15 minutes
          echo "Checks have settled, proceeding with merge"

      - uses: fastify/github-action-merge-dependabot@v3
        continue-on-error: true
        with:
          merge-method: squash
          use-github-auto-merge: true
