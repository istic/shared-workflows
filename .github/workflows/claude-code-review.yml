name: "[Review] Claude Code"

# Consumers choose the trigger, e.g.:
#
#   on:
#     pull_request:
#       types: [ready_for_review]
#   jobs:
#     review:
#       uses: istic/shared-workflows/.github/workflows/claude-code-review.yml@main
#       secrets: inherit
#
# Add `opened` to the types to also review PRs that are opened non-draft.

on:
  workflow_call:
    inputs:
      model:
        description: "Claude model to use for the review. Empty uses the action default."
        type: string
        default: ""
    secrets:
      ANTHROPIC_API_KEY:
        description: "Anthropic API key. Provide this or CLAUDE_CODE_OAUTH_TOKEN."
        required: false
      CLAUDE_CODE_OAUTH_TOKEN:
        description: "Claude Code OAuth token (Pro/Max subscription). Provide this or ANTHROPIC_API_KEY."
        required: false

jobs:
  review:
    # Drafts are skipped; fork PRs can't see secrets, so skip them too.
    if: >-
      github.event.pull_request.draft == false &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read

    steps:
      - name: Validate credentials
        env:
          API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "$API_KEY" ] && [ -z "$OAUTH_TOKEN" ]; then
            echo "::error::Neither ANTHROPIC_API_KEY nor CLAUDE_CODE_OAUTH_TOKEN is set. Add one as a repo/org secret and pass it (or use 'secrets: inherit')."
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Run Claude Code review
        uses: anthropics/claude-code-action@f3b070c88125d33dbae5653df5f143101d4ea9dc # v1.0.276
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request. Use `gh pr view` and `gh pr diff` to read it.
            Focus on correctness bugs, security problems, missing error handling and
            missing tests. Follow any conventions in CLAUDE.md. Skip style nitpicks a
            linter would catch.

            Post line-specific problems as inline comments, then a single short
            summary with `gh pr comment`. If nothing is wrong, say so in one line.
          claude_args: >-
            ${{ inputs.model != '' && format('--model {0} ', inputs.model) || '' }}--allowedTools
            "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
